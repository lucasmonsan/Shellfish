name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Monsan Standards
        run: |
          mkdir -p ../../packages
          git clone --depth 1 -b feat/centralized-standards-module https://github.com/lucasmonsan/Zoo.git /tmp/zoo 2>/dev/null || git clone --depth 1 https://github.com/lucasmonsan/Zoo.git /tmp/zoo
          cp -r /tmp/zoo/packages/standards ../../packages/standards
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
